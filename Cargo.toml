[package]
authors = ["The ruline contributors", "The Nushell Project Developers"]
description = "A GNU readline-compatible line editor for niubash"
edition = "2021"
license = "MIT"
# The package keeps the `reedline` name so the public Rust API and the
# niubash `[patch.crates-io]` entry stay source-compatible during the
# ruline transition. The product is ruline; the crate rename is tracked
# separately (unixwin/ruline#8 follow-up).
name = "reedline"
repository = "https://github.com/unixwin/ruline"
homepage = "https://github.com/unixwin/ruline"
readme = "README.md"
rust-version = "1.95.0"
version = "0.52.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
doctest = true

[dependencies]
arboard = { version = "3.3.0", optional = true, default-features = false, features = [
    "wayland-data-control",
] }
crossterm = { version = "0.29.0", features = ["serde"] }
nu-ansi-term = "0.50.0"
serde = { version = "1.0.229", features = ["derive"] }
strip-ansi-escapes = "0.2.0"
strum = { version = "0.28.0", features = ["derive"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = [
    "std",
    "termios",
    "process",
] }

[target.'cfg(windows)'.dependencies]
crossterm_winapi = "0.9.1"

[target.'cfg(target_os = "android")'.dependencies]
# `File::lock` in std is unsupported on Android before Rust 1.98.
fd-lock = "4.0.4"

[dev-dependencies]
gethostname = "1.1.0"
jiff = "0.2.38"
pretty_assertions = "1.4.0"
rstest = { version = "0.26.1", default-features = false }
serde_json = "1.0"
tempfile = "3.3.0"
vt100 = "0.16.2"

[features]
default = []
bashisms = []
# No-op: the printer is always compiled in. Kept so `--features external_printer` still builds.
external_printer = []
system_clipboard = ["arboard"]
libc = ["crossterm/libc"]

[[example]]
name = "paste_interceptor"
required-features = ["system_clipboard"]

[package.metadata.docs.rs]
# Whether to pass `--all-features` to Cargo (default: false)
all-features = false
features = ["bashisms"]
